name: Deploy the landing page

# Runs by hand only. The page is published with GitHub Pages (source: GitHub Actions), and
# the film is not in git: it is taken from a release (film-clean.mp4 and film.vtt).
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to take the film from (empty for the latest release)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the film from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          mkdir -p site/media
          gh release download $TAG --pattern film-clean.mp4 --pattern film.vtt --dir site/media
          ls -l site/media
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
